# Harness config for Court Vision. Plugin defaults (providers, pricing, loop limits) live in
# /Users/christianarbelaez/code/software-factory/scripts/defaults.toml; anything set here overrides them for this project only.

[project]
name = "Court Vision"
description = "Court Vision: a browser basketball game that teaches floor reads. Static site, no backend. TypeScript (strict), Vite, three.js (pinned exact), Vitest, ESLint (flat config), Prettier. Layers in src/: sim, content, ai (headless, no three.js/DOM) and input, render, ui, audio, app (browser). Spec: docs/DESIGN_DOC.md; decisions: .factory/decisions.md."
# Extra things the reviewers should check in this codebase:
review_focus = []

[accounts]
claude = "personal"
github = "Arbelaezch"
# git_email = "you@example.com"  # doctor warns if a repo commits as someone else

[git]
mode = "commit"
base_branch = "main"

[repos.app]
path = "."
description = "TypeScript + Vite + three.js browser game; single npm package at the repo root"
# test and build have no `kind` because the harness has no Vitest/Vite parser, so they are plain pass/fail gates.
gates = [
  { name = "typecheck", kind = "tsc", cmd = "npx tsc --noEmit --pretty false" },
  { name = "lint", kind = "eslint", cmd = "npx eslint ." },
  { name = "test", cmd = "npx vitest run" },
  { name = "build", cmd = "npx vite build" },
]
